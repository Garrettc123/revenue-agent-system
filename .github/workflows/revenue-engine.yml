name: Revenue Engine — Daily Prospecting & Outreach

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not execute payout/outreach side effects)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

jobs:
  prospecting-agent:
    name: Run Revenue Orchestration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run tests
        run: pytest -q
      - name: Verify Flask application import
        env:
          FLASK_ENV: production
        run: python -c "from app import app; print('Revenue app imported:', app.name); print('Routes:', len(app.url_map.iter_rules()))"
      - name: Dry-run orchestration check
        env:
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          python - <<'PY'
          import os
          from master_conductor import get_conductor
          conductor = get_conductor()
          print('DRY_RUN =', os.getenv('DRY_RUN', 'true'))
          print('Revenue dashboard available:', isinstance(conductor.get_master_dashboard(), dict))
          print('System health available:', isinstance(conductor.get_system_health(), dict))
          print('Orchestration validation passed.')
          PY
      - name: Post run summary
        if: always()
        run: |
          echo "## Revenue Engine Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
