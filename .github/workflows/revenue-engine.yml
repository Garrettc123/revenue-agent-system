name: Revenue Engine — Autonomous Runtime Validation

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not execute payout/outreach side effects)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

jobs:
  prospecting-agent:
    name: Validate Autonomous Revenue Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run tests
        run: pytest -q
      - name: Verify production WSGI and autonomous routes
        env:
          AUTONOMOUS_RUNTIME_ENABLED: '0'
          FLASK_ENV: production
        run: |
          python - <<'PY'
          from funnel_control.wsgi import app
          routes = {rule.rule for rule in app.url_map.iter_rules()}
          required = {
              '/api/agents/status', '/api/agents/start', '/api/agents/stop',
              '/api/agents/force-cycle', '/api/agents/events', '/api/agents/health'
          }
          missing = required - routes
          assert not missing, f'Missing autonomous routes: {sorted(missing)}'
          print('Autonomous control plane validated:', sorted(required))
          PY
      - name: Execute isolated runtime cycle
        env:
          AUTONOMOUS_RUNTIME_ENABLED: '0'
          AUTONOMOUS_RUNTIME_DB: /tmp/ci-runtime.sqlite3
        run: |
          python - <<'PY'
          from autonomous_runtime import AutonomousRuntime
          runtime = AutonomousRuntime(revenue_reader=lambda: {
              'configured': True, 'mrr': 2500, 'customers': 10,
              'arr': 30000, 'total_revenue': 5000
          })
          result = runtime.force_cycle()
          assert result['status'] == 'completed'
          assert result['cycle_count'] == 1
          assert runtime.ledger.recent(1)
          print('Autonomous cycle validated:', result['cycle_id'])
          PY
      - name: Dry-run orchestration check
        env:
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
        run: |
          python - <<'PY'
          import os
          from master_conductor import get_conductor
          conductor = get_conductor()
          print('DRY_RUN =', os.getenv('DRY_RUN', 'true'))
          print('Revenue dashboard available:', isinstance(conductor.get_master_dashboard(), dict))
          print('System health available:', isinstance(conductor.get_system_health(), dict))
          print('Orchestration validation passed.')
          PY
      - name: Post run summary
        if: always()
        run: |
          echo "## Autonomous Revenue Runtime Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
